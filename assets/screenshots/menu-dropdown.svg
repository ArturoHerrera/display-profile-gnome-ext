<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="460" height="380">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3584e4" />
      <stop offset="100%" stop-color="#1c71d8" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e1e" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
  </defs>

  <!-- GNOME Top Bar Mockup Section -->
  <g id="topbar">
    <rect x="0" y="0" width="460" height="42" fill="#111111" />
    <text x="230" y="26" fill="#e0e0e0" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Wed 14:30</text>
    
    <!-- Top Bar Indicator Button (Active) -->
    <rect x="18" y="6" width="34" height="30" rx="15" fill="#303030" />
    <!-- Display Monitor Icon -->
    <path d="M 28 15 L 42 15 C 43.1 15 44 15.9 44 17 L 44 26 C 44 27.1 43.1 28 42 28 L 28 28 C 26.9 28 26 27.1 26 26 L 26 17 C 26 15.9 26.9 15 28 15 Z M 33 29 L 37 29 L 38 31 L 32 31 Z" fill="#ffffff" />
  </g>

  <!-- Dropdown Menu Window -->
  <g id="menu-dropdown" filter="url(#shadow)">
    <!-- Main Menu Background -->
    <rect x="18" y="48" width="424" height="312" rx="14" fill="#242424" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

    <!-- Monitor Header Box -->
    <g transform="translate(32, 64)">
      <!-- Monitor Icon -->
      <rect x="0" y="2" width="28" height="24" rx="4" fill="#3584e4" fill-opacity="0.2" stroke="#3584e4" stroke-width="1.5" />
      <path d="M 6 8 L 22 8 L 22 20 L 6 20 Z M 11 22 L 17 22" stroke="#3584e4" stroke-width="1.5" stroke-linecap="round" fill="none" />
      
      <!-- Monitor Name & Subtitle -->
      <text x="38" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Dell UltraSharp 32" (DP-3)</text>
      <text x="38" y="30" fill="#a0a0a0" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11.5">3840×2160 @ 60Hz · Escala: 200% (VRR Activo)</text>
    </g>

    <!-- Separator -->
    <line x1="32" y1="108" x2="428" y2="108" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Section Label -->
    <text x="34" y="126" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">PERFILES DE PANTALLA</text>

    <!-- Profile Item 1: Active Profile (Trabajo 4K) -->
    <g transform="translate(28, 134)">
      <rect x="0" y="0" width="404" height="46" rx="8" fill="#3584e4" fill-opacity="0.18" stroke="#3584e4" stroke-opacity="0.4" stroke-width="1" />
      <!-- Radio / Active Dot -->
      <circle cx="20" cy="23" r="6" fill="#3584e4" />
      <circle cx="20" cy="23" r="2.5" fill="#ffffff" />
      <!-- Text -->
      <text x="38" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Trabajo 4K (Escala 200%)</text>
      <text x="38" y="35" fill="#78aeed" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11">3840×2160 · 60Hz · VRR: Sí · Horizontal</text>
      <!-- Active Badge -->
      <rect x="330" y="13" width="60" height="20" rx="10" fill="#3584e4" />
      <text x="360" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">ACTIVO</text>
    </g>

    <!-- Profile Item 2: Gaming 1440p -->
    <g transform="translate(28, 186)">
      <rect x="0" y="0" width="404" height="42" rx="8" fill="rgba(255,255,255,0.03)" />
      <!-- Unchecked Circle -->
      <circle cx="20" cy="21" r="5.5" fill="none" stroke="#666666" stroke-width="1.5" />
      <!-- Text -->
      <text x="38" y="19" fill="#e0e0e0" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Gaming 1440p (Escala 100%)</text>
      <text x="38" y="33" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11">2560×1440 · 144Hz · VRR: Sí · Horizontal</text>
    </g>

    <!-- Profile Item 3: Lectura / Codificación -->
    <g transform="translate(28, 234)">
      <rect x="0" y="0" width="404" height="42" rx="8" fill="rgba(255,255,255,0.03)" />
      <!-- Unchecked Circle -->
      <circle cx="20" cy="21" r="5.5" fill="none" stroke="#666666" stroke-width="1.5" />
      <!-- Text -->
      <text x="38" y="19" fill="#e0e0e0" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Lectura y Código (Escala 150%)</text>
      <text x="38" y="33" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11">3840×2160 · 60Hz · VRR: No · Horizontal</text>
    </g>

    <!-- Separator -->
    <line x1="32" y1="284" x2="428" y2="284" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Bottom Actions -->
    <g transform="translate(32, 292)">
      <!-- Save Current Configuration -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="220" height="34" rx="6" fill="rgba(255,255,255,0.05)" />
        <!-- Save icon -->
        <path d="M 12 11 L 18 11 L 22 15 L 22 23 L 12 23 Z M 14 11 L 14 14 L 18 14 L 18 11 Z" fill="#3584e4" />
        <text x="28" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Guardar Configuración Actual</text>
      </g>

      <!-- Preferences Button -->
      <g transform="translate(228, 0)">
        <rect x="0" y="0" width="168" height="34" rx="6" fill="rgba(255,255,255,0.05)" />
        <!-- Gear icon -->
        <circle cx="16" cy="17" r="4.5" fill="none" stroke="#a0a0a0" stroke-width="1.5" />
        <text x="28" y="22" fill="#d0d0d0" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Preferencias</text>
      </g>
    </g>
  </g>
</svg>

