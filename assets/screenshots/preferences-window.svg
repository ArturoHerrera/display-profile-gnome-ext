<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="540" height="420">
  <defs>
    <filter id="adwShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Libadwaita Preferences Window -->
  <g id="prefs-window" filter="url(#adwShadow)">
    <!-- Window Frame -->
    <rect x="20" y="20" width="500" height="380" rx="14" fill="#242424" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

    <!-- Window Headerbar -->
    <path d="M 20 34 C 20 26.27 26.27 20 34 20 L 506 20 C 513.73 20 520 26.27 520 34 L 520 68 L 20 68 Z" fill="#2d2d2d" />
    <line x1="20" y1="68" x2="520" y2="68" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Window Controls (Close button on right in GNOME) -->
    <circle cx="500" cy="44" r="11" fill="rgba(255,255,255,0.08)" />
    <path d="M 496 40 L 504 48 M 504 40 L 496 48" stroke="#cccccc" stroke-width="1.3" stroke-linecap="round" />

    <!-- Window Title -->
    <text x="270" y="49" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Preferencias de Perfiles de Pantalla</text>

    <!-- Libadwaita Preferences Group 1 -->
    <g transform="translate(42, 90)">
      <!-- Group Header -->
      <text x="0" y="16" fill="#78aeed" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.4">DELL ULTRASHARP 32" (DP-3)</text>
      <text x="0" y="32" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11.5">ID de Hardware: DP-3:DEL:4102 · Resolución nativa: 3840×2160</text>

      <!-- Adw.ActionRow 1 -->
      <g transform="translate(0, 44)">
        <!-- Row Container -->
        <path d="M 8 0 L 448 0 C 452.4 0 456 3.6 456 8 L 456 50 L 0 50 L 0 8 C 0 3.6 3.6 0 8 0 Z" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <line x1="0" y1="50" x2="456" y2="50" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

        <!-- Row Icon -->
        <rect x="16" y="14" width="22" height="18" rx="3" fill="#3584e4" fill-opacity="0.2" />
        <circle cx="27" cy="23" r="3" fill="#3584e4" />

        <!-- Row Labels -->
        <text x="48" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Trabajo 4K (200% escala)</text>
        <text x="48" y="40" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11">3840×2160 @ 60Hz · VRR: Sí · Modo: Persistente</text>

        <!-- Delete Button (Adwaita Destructive / Subtle Action) -->
        <g transform="translate(416, 12)">
          <circle cx="13" cy="13" r="13" fill="rgba(230,57,70,0.15)" />
          <!-- Trash Icon -->
          <path d="M 8 9 L 18 9 M 10 9 L 10 17 L 16 17 L 16 9 M 11 9 L 11 7 L 15 7 L 15 9" stroke="#ff7b72" stroke-width="1.3" fill="none" stroke-linecap="round" />
        </g>
      </g>

      <!-- Adw.ActionRow 2 -->
      <g transform="translate(0, 94)">
        <!-- Row Container -->
        <rect x="0" y="0" width="456" height="50" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <line x1="0" y1="50" x2="456" y2="50" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

        <!-- Row Icon -->
        <rect x="16" y="14" width="22" height="18" rx="3" fill="rgba(255,255,255,0.08)" />
        <circle cx="27" cy="23" r="3" fill="#888888" />

        <!-- Row Labels -->
        <text x="48" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Gaming 1440p (100% escala)</text>
        <text x="48" y="40" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11">2560×1440 @ 144Hz · VRR: Sí · Modo: Persistente</text>

        <!-- Delete Button -->
        <g transform="translate(416, 12)">
          <circle cx="13" cy="13" r="13" fill="rgba(230,57,70,0.15)" />
          <path d="M 8 9 L 18 9 M 10 9 L 10 17 L 16 17 L 16 9 M 11 9 L 11 7 L 15 7 L 15 9" stroke="#ff7b72" stroke-width="1.3" fill="none" stroke-linecap="round" />
        </g>
      </g>

      <!-- Adw.ActionRow 3 -->
      <g transform="translate(0, 144)">
        <!-- Row Container (Bottom rounded) -->
        <path d="M 0 0 L 456 0 L 456 42 C 456 46.4 452.4 50 448 50 L 8 50 C 3.6 50 0 46.4 0 42 Z" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

        <!-- Row Icon -->
        <rect x="16" y="14" width="22" height="18" rx="3" fill="rgba(255,255,255,0.08)" />
        <circle cx="27" cy="23" r="3" fill="#888888" />

        <!-- Row Labels -->
        <text x="48" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Lectura y Código (150% escala)</text>
        <text x="48" y="40" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11">3840×2160 @ 60Hz · VRR: No · Modo: Persistente</text>

        <!-- Delete Button -->
        <g transform="translate(416, 12)">
          <circle cx="13" cy="13" r="13" fill="rgba(230,57,70,0.15)" />
          <path d="M 8 9 L 18 9 M 10 9 L 10 17 L 16 17 L 16 9 M 11 9 L 11 7 L 15 7 L 15 9" stroke="#ff7b72" stroke-width="1.3" fill="none" stroke-linecap="round" />
        </g>
      </g>
    </g>

    <!-- Libadwaita Footer Note -->
    <text x="270" y="365" fill="#777777" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="middle">Los cambios se sincronizan automáticamente con ~/.config/display-profiles/profiles.json</text>
  </g>
</svg>

