<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" width="580" height="430">
  <defs>
    <filter id="termShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Terminal Window Container -->
  <g id="terminal-window" filter="url(#termShadow)">
    <rect x="20" y="20" width="540" height="390" rx="12" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

    <!-- Title Bar -->
    <path d="M 20 32 C 20 25.37 25.37 20 32 20 L 548 20 C 554.63 20 560 25.37 560 32 L 560 56 L 20 56 Z" fill="#202023" />
    <line x1="20" y1="56" x2="560" y2="56" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="40" cy="38" r="6" fill="#ff5f56" />
    <circle cx="58" cy="38" r="6" fill="#ffbd2e" />
    <circle cx="76" cy="38" r="6" fill="#27c93f" />

    <!-- Title Text -->
    <text x="290" y="42" fill="#888890" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'Fira Code', monospace" font-size="12" text-anchor="middle">terminal — display-profiles</text>

    <!-- Terminal Content Area -->
    <g transform="translate(38, 80)" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" xml:space="preserve">
      <!-- Command 1 Prompt -->
      <text x="0" y="0"><tspan fill="#4ade80">user@gnome</tspan><tspan fill="#71717a">:</tspan><tspan fill="#60a5fa">~/dev/my-display-profile</tspan><tspan fill="#f43f5e">$</tspan> <tspan fill="#f4f4f5">./bin/display-profiles status</tspan></text>

      <!-- Status Output -->
      <text x="0" y="22" fill="#38bdf8">========================================</text>
      <text x="0" y="38" fill="#38bdf8" font-weight="700">  ESTADO ACTUAL DE MONITORES</text>
      <text x="0" y="54" fill="#38bdf8">========================================</text>
      <text x="0" y="74" fill="#ffffff" font-weight="700">Monitor: Dell UltraSharp 32" (DP-3)</text>
      <text x="0" y="92" fill="#a1a1aa">  ID de Hardware: <tspan fill="#e4e4e7">DP-3:DEL:4102</tspan></text>
      <text x="0" y="108" fill="#a1a1aa">  Resolución:     <tspan fill="#4ade80" font-weight="700">3840 × 2160</tspan></text>
      <text x="0" y="124" fill="#a1a1aa">  Refresco:       <tspan fill="#e4e4e7">60 Hz (VRR Activo)</tspan></text>
      <text x="0" y="140" fill="#a1a1aa">  Escala UI:      <tspan fill="#facc15" font-weight="700">200% (2.0)</tspan></text>
      <text x="0" y="156" fill="#a1a1aa">  Orientación:    <tspan fill="#e4e4e7">Normal (Horizontal)</tspan></text>
      <text x="0" y="172" fill="#a1a1aa">  Principal:      <tspan fill="#60a5fa">Sí</tspan></text>

      <!-- Command 2 Prompt -->
      <text x="0" y="206"><tspan fill="#4ade80">user@gnome</tspan><tspan fill="#71717a">:</tspan><tspan fill="#60a5fa">~/dev/my-display-profile</tspan><tspan fill="#f43f5e">$</tspan> <tspan fill="#f4f4f5">./bin/display-profiles list</tspan></text>

      <!-- List Output -->
      <text x="0" y="228" fill="#38bdf8">========================================</text>
      <text x="0" y="244" fill="#38bdf8" font-weight="700">  PERFILES GUARDADOS</text>
      <text x="0" y="260" fill="#38bdf8">========================================</text>
      <text x="0" y="280" fill="#ffffff" font-weight="700">Monitor: Dell UltraSharp 32" (DP-3)</text>
      <text x="0" y="298"><tspan fill="#a1a1aa">  - </tspan><tspan fill="#4ade80" font-weight="700">"Trabajo 4K"</tspan> <tspan fill="#38bdf8" font-weight="700">[*ACTIVO*]</tspan></text>
      <text x="0" y="314" fill="#71717a">      3840×2160 @ 60Hz | Escala: 200% | VRR: Sí</text>
      <text x="0" y="332"><tspan fill="#a1a1aa">  - </tspan><tspan fill="#f4f4f5" font-weight="600">"Gaming 1440p"</tspan></text>
      <text x="0" y="348" fill="#71717a">      2560×1440 @ 144Hz | Escala: 100% | VRR: Sí</text>
    </g>
  </g>
</svg>

