<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300">
  <defs>
    <filter id="modalShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dimmed desktop background -->
  <rect x="0" y="0" width="460" height="300" fill="#141414" fill-opacity="0.85" />

  <!-- Modal Dialog Box -->
  <g id="modal-dialog" filter="url(#modalShadow)">
    <rect x="30" y="30" width="400" height="240" rx="16" fill="#242424" stroke="rgba(255,255,255,0.14)" stroke-width="1" />

    <!-- Title & Icon -->
    <g transform="translate(54, 56)">
      <!-- Save Icon Circle -->
      <circle cx="16" cy="16" r="16" fill="#3584e4" fill-opacity="0.2" />
      <path d="M 11 11 L 17 11 L 21 15 L 21 21 L 11 21 Z M 13 11 L 13 14 L 17 14 L 17 11 Z" fill="#3584e4" />

      <!-- Title Text -->
      <text x="44" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Guardar Perfil de Pantalla</text>
      <text x="44" y="32" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="12">Configuración para Dell UltraSharp 32" (DP-3)</text>
    </g>

    <!-- Info Pills -->
    <g transform="translate(54, 114)">
      <rect x="0" y="0" width="85" height="22" rx="11" fill="rgba(255,255,255,0.06)" />
      <text x="42.5" y="15" fill="#cccccc" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">3840×2160</text>

      <rect x="92" y="0" width="55" height="22" rx="11" fill="rgba(255,255,255,0.06)" />
      <text x="119.5" y="15" fill="#cccccc" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">60 Hz</text>

      <rect x="154" y="0" width="80" height="22" rx="11" fill="rgba(53,132,228,0.15)" stroke="#3584e4" stroke-width="1" />
      <text x="194" y="15" fill="#78aeed" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Escala 200%</text>

      <rect x="241" y="0" width="70" height="22" rx="11" fill="rgba(255,255,255,0.06)" />
      <text x="276" y="15" fill="#cccccc" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">VRR Activo</text>
    </g>

    <!-- Text Input Field -->
    <g transform="translate(54, 150)">
      <rect x="0" y="0" width="352" height="42" rx="8" fill="#1a1a1a" stroke="#3584e4" stroke-width="1.5" />
      <text x="14" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="13.5">Trabajo 4K - Productividad</text>
      <!-- Cursor indicator -->
      <line x1="202" y1="13" x2="202" y2="29" stroke="#3584e4" stroke-width="1.5" />
    </g>

    <!-- Modal Action Buttons -->
    <g transform="translate(54, 210)">
      <!-- Cancel Button -->
      <rect x="156" y="0" width="90" height="38" rx="8" fill="rgba(255,255,255,0.08)" />
      <text x="201" y="24" fill="#e0e0e0" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cancelar</text>

      <!-- Save Primary Button -->
      <rect x="254" y="0" width="98" height="38" rx="8" fill="#3584e4" />
      <text x="303" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Cantarell', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Guardar</text>
    </g>
  </g>
</svg>

